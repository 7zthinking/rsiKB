name: Build, test and package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 build
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore KBEA.sln

      - name: Build Release
        run: dotnet build KBEA.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/KBEA.Tests/KBEA.Tests.csproj --configuration Release --no-build

      - name: Publish portable application
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./publish.ps1

      - name: Create portable ZIP and checksum
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "dev-$env:GITHUB_RUN_NUMBER" }
          $zip = "artifacts/KBEA-$tag-win-x64.zip"
          Compress-Archive -Path "artifacts/KBEA-Portable/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$hash  $(Split-Path $zip -Leaf)" -NoNewline
          Write-Host "Created $zip with SHA256 $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KBEA-Portable-${{ github.event.release.tag_name || github.run_number }}
          path: |
            artifacts/KBEA-*-win-x64.zip
            artifacts/KBEA-*-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Attach package to GitHub Release
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: KBEA-Portable-${{ github.event.release.tag_name }}
          path: release-package

      - name: Upload ZIP and checksum to Release
        shell: pwsh
        run: |
          Get-ChildItem -Path release-package -File | ForEach-Object {
            gh release upload $env:RELEASE_TAG $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed." }
          }
